<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Charley Collection — Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #171717;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .login,
    .app {
      min-height: 100vh;
    }

    .login {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    h1 {
      margin-bottom: 7px;
    }

    .muted {
      color: #777;
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 14px 0 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 11px;
      padding: 12px;
      outline: none;
      background: white;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .primary {
      width: 100%;
      background: #111;
      color: white;
      padding: 13px;
      border-radius: 11px;
      font-weight: 700;
      margin-top: 18px;
    }

    .error {
      color: #c00;
      margin-top: 12px;
    }

    .app {
      display: none;
    }

    header {
      background: #111;
      color: white;
      padding: 16px;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logout {
      background: #333;
      color: white;
      padding: 9px 13px;
      border-radius: 9px;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .add {
      background: #111;
      color: white;
      padding: 11px 15px;
      border-radius: 10px;
    }

    .form-card {
      background: white;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 25px;
      display: none;
    }

    .products {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
    }

    .product {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #eee;
    }

    .image {
      height: 220px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
    }

    .image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info {
      padding: 15px;
    }

    .name {
      font-size: 18px;
      font-weight: 700;
    }

    .price {
      font-weight: 700;
      margin: 8px 0;
    }

    .description {
      color: #777;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    .actions button {
      flex: 1;
      padding: 10px;
      border-radius: 9px;
    }

    .edit {
      background: #eee;
    }

    .delete {
      background: #fee;
      color: #b00020;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      background: #eee;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .active {
      background: #e7f8ed;
      color: #18743b;
    }

    .size-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 16px;
    }

    .size-options label {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 9px 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      margin: 0;
      font-weight: 600;
    }

    .size-options input {
      width: auto;
      margin: 0;
      padding: 0;
    }

    .sizes-display {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin: 8px 0 12px;
    }

    .size-badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      background: #f1f1f1;
      font-size: 12px;
      font-weight: 600;
    }

    .form-message {
      margin-top: 12px;
      color: #18743b;
      font-size: 14px;
    }

    @media (min-width: 700px) {
      .products {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>

<body>

<!-- LOGIN -->

<section id="loginScreen" class="login">

  <div class="card">

    <h1>Charley Collection</h1>

    <p class="muted">
      Store Admin
    </p>

    <form id="loginForm">

      <label>Username</label>

      <input
        id="username"
        autocomplete="username"
        required
      >

      <label>Password</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        required
      >

      <button type="submit" class="primary">
        Login
      </button>

      <p id="loginError" class="error"></p>

    </form>

  </div>

</section>


<!-- ADMIN APP -->

<section id="app" class="app">

  <header>

    <div class="header-inner">

      <strong>CHARLEY COLLECTION</strong>

      <button class="logout" onclick="logout()">
        Logout
      </button>

    </div>

  </header>


  <main>

    <div class="top">

      <div>
        <h2>Products</h2>

        <p class="muted">
          Manage your store catalogue
        </p>
      </div>

      <button class="add" onclick="openForm()">
        + Add Product
      </button>

    </div>


    <!-- PRODUCT FORM -->

    <div id="formCard" class="form-card">

      <h2 id="formTitle">
        Add Product
      </h2>

      <form id="productForm">

        <input
          type="hidden"
          id="productId"
        >


        <label>Product Name *</label>

        <input
          id="productName"
          placeholder="Example: Cotton Shirt"
          required
        >


        <label>Category</label>

        <select id="category">

          <option value="Men">Men</option>
          <option value="Women">Women</option>
          <option value="Kids">Kids</option>
          <option value="Accessories">Accessories</option>

        </select>


        <label>Price</label>

        <input
          id="price"
          type="number"
          min="0"
          placeholder="Leave empty for Ask for Price"
        >


        <label>Product Image</label>

        <input
          id="imageFile"
          type="file"
          accept="image/*"
        >

        <input
          id="image"
          type="hidden"
        >


        <div
          id="imagePreview"
          style="margin-top:10px;display:none"
        >

          <img
            id="previewImg"
            style="
              width:120px;
              height:120px;
              object-fit:cover;
              border-radius:12px;
            "
          >

        </div>


        <p
          id="uploadMessage"
          style="margin-top:8px;color:#777"
        ></p>


        <!-- SIZES -->

        <label>
          Available Sizes
        </label>

        <div class="size-options">

          <label>
            <input
              type="checkbox"
              name="size"
              value="S"
            >
            S
          </label>

          <label>
            <input
              type="checkbox"
              name="size"
              value="M"
            >
            M
          </label>

          <label>
            <input
              type="checkbox"
              name="size"
              value="L"
            >
            L
          </label>

          <label>
            <input
              type="checkbox"
              name="size"
              value="XL"
            >
            XL
          </label>

          <label>
            <input
              type="checkbox"
              name="size"
              value="XXL"
            >
            XXL
          </label>

        </div>


        <label>Description</label>

        <textarea
          id="description"
          placeholder="Product description"
        ></textarea>


        <label>

          <input
            id="active"
            type="checkbox"
            checked
            style="width:auto"
          >

          Show product on website

        </label>


        <button
          id="saveButton"
          type="submit"
          class="primary"
        >
          Save Product
        </button>


        <button
          type="button"
          class="primary"
          style="background:#eee;color:#111"
          onclick="closeForm()"
        >
          Cancel
        </button>


        <p
          id="formMessage"
          class="form-message"
        ></p>

      </form>

    </div>


    <div
      id="products"
      class="products"
    ></div>

  </main>

</section>


<script>

let products = [];


/* API */

async function api(url, options = {}) {

  const response = await fetch(url, {

    credentials: "same-origin",

    ...options,

    headers: {
      "Content-Type": "application/json",
      ...(options.headers || {})
    }

  });

  const data =
    await response.json().catch(() => ({}));

  if (!response.ok) {

    throw new Error(
      data.error || "Request failed"
    );

  }

  return data;

}


/* LOGIN */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      const error =
        document.getElementById("loginError");

      const button =
        event.currentTarget.querySelector("button");

      error.textContent = "";

      button.disabled = true;

      button.textContent =
        "Logging in...";


      try {

        await api(
          "/api/admin/login",
          {
            method: "POST",

            body: JSON.stringify({

              username:
                document
                  .getElementById("username")
                  .value
                  .trim(),

              password:
                document
                  .getElementById("password")
                  .value

            })

          }
        );


        showApp();


      } catch (err) {

        error.textContent =
          err.message || "Login failed";

        button.disabled = false;

        button.textContent =
          "Login";

      }

    }
  );


async function checkLogin() {

  try {

    await api(
      "/api/admin/me"
    );

    showApp();

  } catch {

    document
      .getElementById("loginScreen")
      .style.display = "flex";

    document
      .getElementById("app")
      .style.display = "none";

  }

}


function showApp() {

  document
    .getElementById("loginScreen")
    .style.display = "none";

  document
    .getElementById("app")
    .style.display = "block";

  loadProducts();

}


async function logout() {

  try {

    await api(
      "/api/admin/logout",
      {
        method: "POST"
      }
    );

  } finally {

    location.reload();

  }

}


/* PRODUCTS */

async function loadProducts() {

  try {

    products =
      await api(
        "/api/admin/products"
      );

    renderProducts();

  } catch (err) {

    document
      .getElementById("products")
      .innerHTML = `

        <div class="card">

          ${escapeHtml(err.message)}

        </div>

      `;

  }

}


/* RENDER PRODUCTS */

function renderProducts() {

  const container =
    document.getElementById("products");


  if (!products.length) {

    container.innerHTML = `

      <div class="card">

        <h3>No products yet</h3>

        <p class="muted">

          Click "+ Add Product"
          to add your first product.

        </p>

      </div>

    `;

    return;

  }


  container.innerHTML =
    products.map(product => {

      const sizes =
        Array.isArray(product.sizes)
          ? product.sizes
          : [];


      return `

        <article class="product">

          <div class="image">

            ${
              product.image

                ? `

                  <img
                    src="${escapeHtml(product.image)}"
                    alt="${escapeHtml(product.name)}"
                  >

                `

                : "Image coming soon"
            }

          </div>


          <div class="info">


            <span
              class="status ${
                product.active
                  ? "active"
                  : ""
              }"
            >

              ${
                product.active
                  ? "Visible"
                  : "Hidden"
              }

            </span>


            <div class="name">

              ${escapeHtml(product.name)}

            </div>


            <div>

              ${escapeHtml(
                product.category || "Other"
              )}

            </div>


            <div class="price">

              ${
                product.price

                  ? "₹" +
                    Number(
                      product.price
                    ).toLocaleString(
                      "en-IN"
                    )

                  : "Ask for Price"
              }

            </div>


            ${
              sizes.length

                ? `

                  <div class="sizes-display">

                    ${sizes.map(size => `

                      <span class="size-badge">
                        ${escapeHtml(size)}
                      </span>

                    `).join("")}

                  </div>

                `

                : ""
            }


            <div class="description">

              ${escapeHtml(
                product.description ||
                "No description"
              )}

            </div>


            <div class="actions">

              <button
                class="edit"
                onclick="editProduct('${escapeJs(product.id)}')"
              >
                Edit
              </button>


              <button
                class="delete"
                onclick="deleteProduct('${escapeJs(product.id)}')"
              >
                Delete
              </button>

            </div>


          </div>

        </article>

      `;

    }).join("");

}


/* OPEN / EDIT FORM */

function openForm(product = null) {

  const form =
    document.getElementById("productForm");


  form.reset();


  document
    .getElementById("formCard")
    .style.display = "block";


  document
    .getElementById("formTitle")
    .textContent =
      product
        ? "Edit Product"
        : "Add Product";


  document
    .getElementById("productId")
    .value =
      product
        ? product.id
        : "";


  document
    .getElementById("productName")
    .value =
      product
        ? product.name || ""
        : "";


  document
    .getElementById("category")
    .value =
      product
        ? product.category || "Men"
        : "Men";


  document
    .getElementById("price")
    .value =
      product &&
      product.price != null
        ? product.price
        : "";


  document
    .getElementById("image")
    .value =
      product
        ? product.image || ""
        : "";


  document
    .getElementById("description")
    .value =
      product
        ? product.description || ""
        : "";


  document
    .getElementById("active")
    .checked =
      product
        ? product.active !== false
        : true;


  /* LOAD SIZES */

  const productSizes =
    product &&
    Array.isArray(product.sizes)
      ? product.sizes
      : [];


  document
    .querySelectorAll(
      'input[name="size"]'
    )
    .forEach(input => {

      input.checked =
        productSizes.includes(
          input.value
        );

    });


  /* IMAGE PREVIEW */

  const preview =
    document.getElementById(
      "imagePreview"
    );

  const previewImg =
    document.getElementById(
      "previewImg"
    );


  if (
    product &&
    product.image
  ) {

    previewImg.src =
      product.image;

    preview.style.display =
      "block";

  } else {

    preview.style.display =
      "none";

    previewImg.removeAttribute(
      "src"
    );

  }


  document
    .getElementById(
      "uploadMessage"
    )
    .textContent = "";


  document
    .getElementById(
      "formMessage"
    )
    .textContent = "";


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* CLOSE FORM */

function closeForm() {

  document
    .getElementById("formCard")
    .style.display = "none";


  document
    .getElementById("productForm")
    .reset();


  document
    .getElementById("productId")
    .value = "";


  document
    .querySelectorAll(
      'input[name="size"]'
    )
    .forEach(input => {

      input.checked = false;

    });


  document
    .getElementById(
      "imagePreview"
    )
    .style.display = "none";


  document
    .getElementById(
      "previewImg"
    )
    .removeAttribute("src");


  document
    .getElementById(
      "uploadMessage"
    )
    .textContent = "";


  document
    .getElementById(
      "formMessage"
    )
    .textContent = "";

}


/* SAVE PRODUCT */

document
  .getElementById("productForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const id =
        document
          .getElementById("productId")
          .value;


      let imageUrl =
        document
          .getElementById("image")
          .value;


      const file =
        document
          .getElementById("imageFile")
          .files[0];


      const saveButton =
        document
          .getElementById("saveButton");


      const message =
        document
          .getElementById("formMessage");


      try {

        saveButton.disabled = true;

        saveButton.textContent =
          "Saving...";

        message.textContent = "";


        /* IMAGE UPLOAD */

        if (file) {

          const formData =
            new FormData();


          formData.append(
            "image",
            file
          );


          document
            .getElementById(
              "uploadMessage"
            )
            .textContent =
              "Uploading image...";


          const response =
            await fetch(
              "/api/admin/products/upload-image",
              {
                method: "POST",

                credentials:
                  "same-origin",

                body: formData
              }
            );


          const result =
            await response.json();


          if (!response.ok) {

            throw new Error(
              result.error ||
              "Image upload failed"
            );

          }


          imageUrl =
            result.url;


          document
            .getElementById("image")
            .value =
              imageUrl;


          document
            .getElementById(
              "uploadMessage"
            )
            .textContent =
              "Image uploaded successfully.";

        }


        /* GET SELECTED SIZES */

        const sizes =
          Array.from(
            document.querySelectorAll(
              'input[name="size"]:checked'
            )
          ).map(
            input => input.value
          );


        /* PRODUCT DATA */

        const data = {

          name:
            document
              .getElementById(
                "productName"
              )
              .value
              .trim(),

          category:
            document
              .getElementById(
                "category"
              )
              .value,

          price:
            document
              .getElementById(
                "price"
              )
              .value,

          image:
            imageUrl,

          description:
            document
              .getElementById(
                "description"
              )
              .value
              .trim(),

          sizes:
            sizes,

          active:
            document
              .getElementById(
                "active"
              )
              .checked

        };


        /* UPDATE */

        if (id) {

          await api(
            "/api/admin/products/" +
            encodeURIComponent(id),

            {
              method: "PUT",

              body:
                JSON.stringify(data)

            }
          );


          message.textContent =
            "Product updated successfully.";

        }


        /* CREATE */

        else {

          await api(
            "/api/admin/products",

            {
              method: "POST",

              body:
                JSON.stringify(data)

            }
          );


          message.textContent =
            "Product added successfully.";

        }


        await loadProducts();


        setTimeout(
          () => {
            closeForm();
          },
          500
        );


      } catch (err) {

        console.error(
          "PRODUCT SAVE ERROR:",
          err
        );


        message.style.color =
          "#b00020";


        message.textContent =
          err.message ||
          "Something went wrong.";


      } finally {

        saveButton.disabled =
          false;

        saveButton.textContent =
          "Save Product";

      }

    }
  );


/* EDIT */

function editProduct(id) {

  const product =
    products.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if (product) {

    openForm(product);

  }

}


/* DELETE */

async function deleteProduct(id) {

  const product =
    products.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if (!product) return;


  if (
    !confirm(
      `Delete "${product.name}"?`
    )
  ) {

    return;

  }


  try {

    await api(
      "/api/admin/products/" +
      encodeURIComponent(id),

      {
        method: "DELETE"
      }
    );


    await loadProducts();


  } catch (err) {

    alert(
      err.message
    );

  }

}


/* ESCAPE HTML */

function escapeHtml(value) {

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ESCAPE JAVASCRIPT */

function escapeJs(value) {

  return String(value ?? "")
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    );

}


/* IMAGE PREVIEW */

document
  .getElementById("imageFile")
  .addEventListener(
    "change",
    event => {

      const file =
        event.target.files[0];


      if (!file) {

        return;

      }


      const url =
        URL.createObjectURL(
          file
        );


      document
        .getElementById(
          "previewImg"
        )
        .src = url;


      document
        .getElementById(
          "imagePreview"
        )
        .style.display =
          "block";

    }
  );


/* START */

checkLogin();

</script>

</body>
</html>
