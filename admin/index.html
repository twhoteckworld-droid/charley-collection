<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hariom Photography — Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0b;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #171717;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    .brand {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .brand p {
      margin: 0;
      color: #999;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      color: #bbb;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #333;
      background: #0f0f0f;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #777;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .error {
      color: #ff7777;
      margin-top: 12px;
      text-align: center;
    }

    /* DASHBOARD */

    #dashboard {
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid #242424;
      padding: 18px;
      position: sticky;
      top: 0;
      background: rgba(11,11,11,.95);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    header p {
      margin: 4px 0 0;
      color: #888;
      font-size: 13px;
    }

    .logout {
      width: auto;
      margin: 0;
      padding: 10px 16px;
      background: #222;
      color: white;
      border: 1px solid #333;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 22px 16px 50px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .stat {
      background: #171717;
      border: 1px solid #292929;
      border-radius: 14px;
      padding: 18px;
    }

    .stat span {
      display: block;
      color: #888;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .stat strong {
      font-size: 28px;
    }

    .panel {
      background: #171717;
      border: 1px solid #292929;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 22px;
    }

    .panel h2 {
      margin-top: 0;
    }

    #preview {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 12px;
      margin-top: 12px;
    }

    .message {
      text-align: center;
      margin-top: 12px;
      min-height: 20px;
    }

    .success {
      color: #7ee787;
    }

    .danger {
      color: #ff7777;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .photo-card {
      overflow: hidden;
      background: #111;
      border: 1px solid #292929;
      border-radius: 14px;
    }

    .photo-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .photo-info {
      padding: 13px;
    }

    .photo-title {
      font-weight: bold;
      margin-bottom: 6px;
      word-break: break-word;
    }

    .photo-date {
      color: #777;
      font-size: 12px;
      margin-bottom: 12px;
    }

    .delete-btn {
      margin: 0;
      background: #261414;
      color: #ff8c8c;
      border: 1px solid #4a2525;
    }

    .loading,
    .empty {
      color: #888;
      text-align: center;
      padding: 30px 10px;
    }

    @media (max-width: 800px) {
      .photo-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 520px) {
      .header-inner {
        align-items: flex-start;
      }

      .photo-grid {
        grid-template-columns: 1fr;
      }

      .photo-card img {
        height: 250px;
      }

      .login-box {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN -->

  <section id="loginScreen">
    <div class="login-box">

      <div class="brand">
        <h1>Hariom Photography</h1>
        <p>Admin Login</p>
      </div>

      <form id="loginForm">

        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          autocomplete="username"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button id="loginButton" type="submit">
          Login
        </button>

        <div id="loginMessage" class="error"></div>

      </form>

    </div>
  </section>


  <!-- DASHBOARD -->

  <section id="dashboard" class="hidden">

    <header>
      <div class="header-inner">

        <div>
          <h1>Hariom Photography</h1>
          <p>Admin Dashboard</p>
        </div>

        <button
          class="logout"
          onclick="logout()">
          Logout
        </button>

      </div>
    </header>

    <main class="container">

      <div class="stats">

        <div class="stat">
          <span>Total Photos</span>
          <strong id="photoCount">0</strong>
        </div>

        <div class="stat">
          <span>Status</span>
          <strong>Online</strong>
        </div>

      </div>


      <!-- UPLOAD -->

      <div class="panel">

        <h2>Upload New Photo</h2>

        <form id="uploadForm">

          <label for="photo">Photo</label>

          <input
            id="photo"
            type="file"
            accept="image/*"
            required
          >

          <img
            id="preview"
            class="hidden"
            alt="Preview"
          >

          <label for="title">Photo Title</label>

          <input
            id="title"
            type="text"
            maxlength="200"
            placeholder="Enter photo title"
          >

          <button id="uploadButton" type="submit">
            Upload Photo
          </button>

          <div id="uploadMessage" class="message"></div>

        </form>

      </div>


      <!-- PHOTOS -->

      <div class="panel">

        <h2>Photo Library</h2>

        <div
          id="gallery"
          class="photo-grid">
          <div class="loading">
            Loading photos...
          </div>
        </div>

      </div>

    </main>

  </section>


  <script>

    const loginScreen = document.getElementById('loginScreen');
    const dashboard = document.getElementById('dashboard');

    const loginForm = document.getElementById('loginForm');
    const loginButton = document.getElementById('loginButton');
    const loginMessage = document.getElementById('loginMessage');

    const uploadForm = document.getElementById('uploadForm');
    const uploadButton = document.getElementById('uploadButton');
    const uploadMessage = document.getElementById('uploadMessage');

    const photoInput = document.getElementById('photo');
    const titleInput = document.getElementById('title');
    const preview = document.getElementById('preview');

    const gallery = document.getElementById('gallery');
    const photoCount = document.getElementById('photoCount');


    /* =========================
       LOGIN
    ========================= */

    loginForm.addEventListener('submit', async (event) => {

      event.preventDefault();

      loginMessage.textContent = '';
      loginButton.disabled = true;
      loginButton.textContent = 'Logging in...';

      const username =
        document.getElementById('username').value;

      const password =
        document.getElementById('password').value;

      try {

        const response = await fetch(
          '/api/admin/login',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              username,
              password
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || 'Login failed'
          );
        }

        showDashboard();

      } catch (error) {

        loginMessage.textContent =
          error.message;

      } finally {

        loginButton.disabled = false;
        loginButton.textContent = 'Login';

      }

    });


    /* =========================
       SESSION CHECK
    ========================= */

    async function checkSession() {

      try {

        const response = await fetch(
          '/api/admin/me'
        );

        if (response.ok) {
          showDashboard();
        } else {
          showLogin();
        }

      } catch (error) {

        showLogin();

      }

    }


    /* =========================
       SHOW LOGIN
    ========================= */

    function showLogin() {

      loginScreen.classList.remove('hidden');
      dashboard.classList.add('hidden');

    }


    /* =========================
       SHOW DASHBOARD
    ========================= */

    function showDashboard() {

      loginScreen.classList.add('hidden');
      dashboard.classList.remove('hidden');

      loadPhotos();

    }


    /* =========================
       UPLOAD PREVIEW
    ========================= */

    photoInput.addEventListener(
      'change',
      () => {

        const file = photoInput.files[0];

        if (!file) {

          preview.classList.add('hidden');
          preview.removeAttribute('src');

          return;
        }

        preview.src =
          URL.createObjectURL(file);

        preview.classList.remove('hidden');

      }
    );


    /* =========================
       UPLOAD
    ========================= */

    uploadForm.addEventListener(
      'submit',
      async (event) => {

        event.preventDefault();

        const file =
          photoInput.files[0];

        if (!file) {

          uploadMessage.textContent =
            'Please select a photo';

          uploadMessage.className =
            'message danger';

          return;
        }

        const form =
          new FormData();

        form.append(
          'photo',
          file
        );

        form.append(
          'title',
          titleInput.value
        );

        uploadButton.disabled = true;
        uploadButton.textContent =
          'Uploading...';

        uploadMessage.textContent =
          'Uploading photo...';

        uploadMessage.className =
          'message';


        try {

          const response = await fetch(
            '/api/admin/upload',
            {
              method: 'POST',
              body: form
            }
          );

          const data =
            await response.json();

          if (!response.ok) {

            if (response.status === 401) {
              showLogin();
              throw new Error(
                'Session expired. Please login again.'
              );
            }

            throw new Error(
              data.error || 'Upload failed'
            );

          }

          uploadMessage.textContent =
            'Photo uploaded successfully';

          uploadMessage.className =
            'message success';

          uploadForm.reset();

          preview.classList.add('hidden');
          preview.removeAttribute('src');

          await loadPhotos();

        } catch (error) {

          uploadMessage.textContent =
            error.message;

          uploadMessage.className =
            'message danger';

        } finally {

          uploadButton.disabled = false;
          uploadButton.textContent =
            'Upload Photo';

        }

      }
    );


    /* =========================
       LOAD PHOTOS
    ========================= */

    async function loadPhotos() {

      gallery.innerHTML =
        '<div class="loading">Loading photos...</div>';

      try {

        const response = await fetch(
          '/api/admin/photos'
        );

        if (response.status === 401) {

          showLogin();

          return;
        }

        const photos =
          await response.json();

        if (!response.ok) {

          throw new Error(
            photos.error ||
            'Failed to load photos'
          );

        }

        photoCount.textContent =
          photos.length;

        gallery.innerHTML = '';

        if (!photos.length) {

          gallery.innerHTML =
            '<div class="empty">No photos uploaded yet.</div>';

          return;
        }

        photos.forEach(
          (photo) => {

            const card =
              document.createElement('article');

            card.className =
              'photo-card';

            const img =
              document.createElement('img');

            img.src =
              photo.url;

            img.alt =
              photo.title || 'Photo';

            const info =
              document.createElement('div');

            info.className =
              'photo-info';

            const title =
              document.createElement('div');

            title.className =
              'photo-title';

            title.textContent =
              photo.title || 'Untitled';

            const date =
              document.createElement('div');

            date.className =
              'photo-date';

            date.textContent =
              formatDate(photo.uploadedAt);

            const button =
              document.createElement('button');

            button.className =
              'delete-btn';

            button.textContent =
              'Delete Photo';

            button.addEventListener(
              'click',
              () => deletePhoto(photo.id)
            );

            info.appendChild(title);
            info.appendChild(date);
            info.appendChild(button);

            card.appendChild(img);
            card.appendChild(info);

            gallery.appendChild(card);

          }
        );

      } catch (error) {

        gallery.innerHTML =
          '<div class="empty">' +
          'Failed to load photos' +
          '</div>';

      }

    }


    /* =========================
       DELETE
    ========================= */

    async function deletePhoto(id) {

      const confirmed =
        confirm(
          'Are you sure you want to delete this photo?'
        );

      if (!confirmed) {
        return;
      }

      try {

        const response =
          await fetch(
            '/api/admin/photos/' + id,
            {
              method: 'DELETE'
            }
          );

        const data =
          await response.json();

        if (response.status === 401) {

          showLogin();

          return;
        }

        if (!response.ok) {

          throw new Error(
            data.error || 'Delete failed'
          );

        }

        await loadPhotos();

      } catch (error) {

        alert(
          error.message
        );

      }

    }


    /* =========================
       LOGOUT
    ========================= */

    async function logout() {

      try {

        await fetch(
          '/api/admin/logout',
          {
            method: 'POST'
          }
        );

      } finally {

        showLogin();

        loginForm.reset();

        loginMessage.textContent = '';

      }

    }


    /* =========================
       DATE
    ========================= */

    function formatDate(date) {

      if (!date) {
        return '';
      }

      try {

        return new Date(date)
          .toLocaleString();

      } catch {

        return '';

      }

    }


    /* =========================
       START
    ========================= */

    checkSession();

  </script>

</body>
</html>
